# Ephemeral, non-signing Sora iPad validation pipeline. Never merge this file to main.
trigger: none
pr: none

name: sora-ipad-1.19.1-$(Date:yyyyMMdd).$(Rev:r)

variables:
  DOTNET_VERSION: '10.0.302'
  XCODE_PATH: '/Applications/Xcode_26.0.1.app/Contents/Developer'
  RELEASE_BASE: '7de3de3c2ddda0b30abb0c42d5b1fd2c2b859710'
  ADMIN_KEY: 'sora-ipad-validation'
  RELAY_URL: 'http://127.0.0.1:52777'

pool:
  vmImage: macos-15

workspace:
  clean: all

steps:
- checkout: self
  clean: true
  fetchDepth: 0
  persistCredentials: false

- bash: |
    set -euo pipefail
    test "$(Build.SourceBranch)" = "refs/heads/hotfix/1.19.1-sora"
    git cat-file -e "$(RELEASE_BASE)^{commit}"
    git merge-base --is-ancestor "$(RELEASE_BASE)" HEAD
    git diff --check "$(RELEASE_BASE)" HEAD
    git diff --name-only "$(RELEASE_BASE)" HEAD | sort > "$(Build.ArtifactStagingDirectory)/candidate-files.txt"
    git rev-parse HEAD > "$(Build.ArtifactStagingDirectory)/candidate-commit.txt"
  displayName: Verify exact base-derived candidate

- task: UseDotNet@2
  displayName: Use exact .NET 10.0.302 SDK
  inputs:
    packageType: sdk
    version: $(DOTNET_VERSION)

- bash: |
    set -euo pipefail
    sudo xcode-select --switch "$(XCODE_PATH)"
    test "$(dotnet --version)" = "$(DOTNET_VERSION)"
    xcodebuild -version
    dotnet workload install maui-ios maui-android maui-maccatalyst --skip-manifest-update
    dotnet workload list
  displayName: Select Xcode and install release-aligned workloads

- bash: |
    set -euo pipefail
    arch="$(uname -m)"
    case "$arch" in
      arm64) rid="iossimulator-arm64" ;;
      x86_64) rid="iossimulator-x64" ;;
      *) echo "Unsupported macOS host architecture: $arch"; exit 1 ;;
    esac
    dotnet build src/Mesh.Relay/Mesh.Relay.csproj \
      -c Debug -p:MeshRelayTestFaults=true
    dotnet build src/Mesh.App/Mesh.App.csproj \
      -f net10.0-ios -c Debug \
      -p:RuntimeIdentifier="$rid" \
      -p:CodesignKey=- \
      -p:CodesignProvision= \
      -p:ArchiveOnBuild=false
    relay_path="$(find src/Mesh.Relay/bin/Debug/net10.0/test-hooks -name 'Mesh.Relay.TestHooks.dll' | head -n 1)"
    app_path="$(find src/Mesh.App/bin/Debug/net10.0-ios -type d -name '*.app' | head -n 1)"
    test -f "$relay_path"
    test -d "$app_path"
    test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" = "net.meshrelay.mesh"
    printf '%s' "$relay_path" > "$(Agent.TempDirectory)/relay-path.txt"
    printf '%s' "$app_path" > "$(Agent.TempDirectory)/app-path.txt"
    printf '%s' "$rid" > "$(Agent.TempDirectory)/simulator-rid.txt"
  displayName: Build Relay and non-signing iOS Simulator app

- bash: |
    set -euo pipefail
    curl -fsSL "https://get.maestro.mobile.dev" | bash
    export PATH="$HOME/.maestro/bin:$PATH"
    maestro --version
  displayName: Install iOS UI automation

- bash: |
    set -euo pipefail
    export PATH="$HOME/.maestro/bin:$PATH"
    export DEVELOPER_DIR="$(XCODE_PATH)"
    artifact_root="$(Build.ArtifactStagingDirectory)/sora-ipad-validation"
    mkdir -p "$artifact_root/screenshots" "$(Agent.TempDirectory)/sora-link"

    relay_path="$(cat "$(Agent.TempDirectory)/relay-path.txt")"
    app_path="$(cat "$(Agent.TempDirectory)/app-path.txt")"
    export ASPNETCORE_URLS="$(RELAY_URL)"
    export ASPNETCORE_ENVIRONMENT=Test
    export MESH_LIVE_FAULTS_ENABLED=true
    export MESH_ADMIN_KEY="$(ADMIN_KEY)"
    export MESH_REQUIRE_METADATA_STORAGE=false
    export MESH_MSG_RATE_PER_MIN=6000
    export MESH_MSG_BURST=1000
    dotnet "$relay_path" > "$artifact_root/relay-redacted.log" 2>&1 &
    relay_pid=$!

    udid=""
    cleanup() {
      set +e
      if [[ -n "$udid" ]]; then
        xcrun simctl shutdown "$udid" >/dev/null 2>&1
        xcrun simctl delete "$udid" >/dev/null 2>&1
      fi
      kill "$relay_pid" >/dev/null 2>&1
      wait "$relay_pid" >/dev/null 2>&1
    }
    trap cleanup EXIT

    for _ in $(seq 1 100); do
      if curl -fsS "$(RELAY_URL)/health" >/dev/null; then break; fi
      sleep 0.2
    done
    curl -fsS "$(RELAY_URL)/health" >/dev/null

    cat > "$(Agent.TempDirectory)/sora-link/SoraLink.csproj" <<EOF
    <Project Sdk="Microsoft.NET.Sdk">
      <PropertyGroup>
        <OutputType>Exe</OutputType>
        <TargetFramework>net10.0</TargetFramework>
        <ImplicitUsings>enable</ImplicitUsings>
      </PropertyGroup>
      <ItemGroup>
        <ProjectReference Include="$(Build.SourcesDirectory)/src/Mesh.Shared/Mesh.Shared.csproj" />
      </ItemGroup>
    </Project>
    EOF
    cat > "$(Agent.TempDirectory)/sora-link/Program.cs" <<'EOF'
    using System.Net.Http.Json;
    using System.Security.Cryptography;
    using System.Text;
    using Mesh.Shared;

    var relay = args[0];
    var handle = args[1];
    using var ec = ECDsa.Create(ECCurve.NamedCurves.nistP256);
    var privateKey = Convert.ToBase64String(ec.ExportPkcs8PrivateKey());
    var publicKey = Convert.ToBase64String(ec.ExportSubjectPublicKeyInfo());
    string Sign(string message)
    {
        using var signer = ECDsa.Create();
        signer.ImportPkcs8PrivateKey(Convert.FromBase64String(privateKey), out _);
        return Convert.ToBase64String(
            signer.SignData(Encoding.UTF8.GetBytes(message), HashAlgorithmName.SHA256));
    }
    var genesis = OnlineReplicationProtocol.CreateCustodyEntry(
        handle, 0, OnlineReplicationProtocol.ZeroHash, CustodyAction.Genesis,
        publicKey, null, DateTimeOffset.UtcNow.ToUnixTimeMilliseconds(),
        publicKey, privateKey);
    using var http = new HttpClient { BaseAddress = new Uri(relay) };
    using var registration = await http.PostAsJsonAsync(
        "/handles",
        new RegisterHandleRequest(
            handle, publicKey, "Sora iPad synthetic", Signature: Sign(
                ClaimProtocol.Message(handle, publicKey)),
            DeviceName: "CI link authority", DevicePlatform: "macos",
            AgentHostEnabled: true, CustodyAuthority: genesis));
    registration.EnsureSuccessStatusCode();
    var code = Convert.ToBase64String(RandomNumberGenerator.GetBytes(18))
        .Replace('+', '-').Replace('/', '_').TrimEnd('=');
    var codeHash = LinkProtocol.HashCode(code);
    var expires = DateTimeOffset.UtcNow.AddMinutes(10).ToUnixTimeSeconds();
    using var invite = await http.PostAsJsonAsync(
        $"/handles/{handle}/link/invite",
        new LinkInviteRequest(
            handle, publicKey, codeHash, expires,
            Sign(LinkProtocol.InviteMessage(handle, codeHash, expires))));
    invite.EnsureSuccessStatusCode();
    Console.WriteLine(DeepLink.Pairing(handle, code, relay));
    Console.WriteLine(handle);
    Console.Write(code);
    EOF
    dotnet build "$(Agent.TempDirectory)/sora-link/SoraLink.csproj" -c Release \
      -o "$(Agent.TempDirectory)/sora-link/out" >/dev/null
    handle="sora-ipad-$(Build.BuildId)"
    dotnet "$(Agent.TempDirectory)/sora-link/out/SoraLink.dll" \
      "$(RELAY_URL)" "$handle" > "$(Agent.TempDirectory)/pairing-uri.txt"
    code="$(sed -n '3p' "$(Agent.TempDirectory)/pairing-uri.txt")"

    runtime_id="$(xcrun simctl list runtimes -j | python3 -c '
    import json,sys
    values=[r for r in json.load(sys.stdin)["runtimes"]
            if r.get("isAvailable") and r.get("identifier","").startswith(
                "com.apple.CoreSimulator.SimRuntime.iOS-")]
    if not values: raise SystemExit("No available iOS runtime")
    print(sorted(values,key=lambda r: tuple(int(x) for x in r["version"].split(".")))[-1]["identifier"])
    ')"
    ipad_type="$(xcrun simctl list devicetypes -j | python3 -c '
    import json,sys
    values=[d for d in json.load(sys.stdin)["devicetypes"]
            if d.get("name","").startswith("iPad Pro 13-inch")]
    if not values: raise SystemExit("No 13-inch iPad simulator type")
    print(values[0]["identifier"])
    ')"
    udid="$(xcrun simctl create Sora-iPad-13 "$ipad_type" "$runtime_id")"
    xcrun simctl boot "$udid"
    xcrun simctl bootstatus "$udid" -b
    xcrun simctl status_bar "$udid" override \
      --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3
    xcrun simctl install "$udid" "$app_path"
    xcrun simctl launch "$udid" net.meshrelay.mesh
    sleep 20
    xcrun simctl io "$udid" screenshot "$artifact_root/screenshots/00-onboarding.png"

    cat > "$(Agent.TempDirectory)/finish-onboarding.yaml" <<'EOF'
    appId: net.meshrelay.mesh
    ---
    - tapOn:
        point: "50%,52%"
    - waitForAnimationToEnd
    - tapOn: "https://mesh-relay...azurecontainerapps.io"
    EOF
    cat >> "$(Agent.TempDirectory)/finish-onboarding.yaml" <<EOF
    - inputText: "$(RELAY_URL)"
    - tapOn: "yourname"
    - inputText: "$handle"
    - tapOn: "paste code"
    - inputText: "$code"
    EOF
    cat >> "$(Agent.TempDirectory)/finish-onboarding.yaml" <<'EOF'
    - hideKeyboard
    - tapOn: "Link this device"
    - extendedWaitUntil:
        visible: "Connect a model"
        timeout: 30000
    - assertVisible: "Connect a model"
    - tapOn: "Start free"
    - waitForAnimationToEnd
    - assertVisible: "New chat"
    - tapOn: "New chat"
    - waitForAnimationToEnd
    - assertVisible: "Me"
    EOF
    maestro --device "$udid" test \
      --debug-output "$artifact_root/maestro-debug" \
      "$(Agent.TempDirectory)/finish-onboarding.yaml"
    xcrun simctl io "$udid" screenshot "$artifact_root/screenshots/01-authenticated-synthetic-topic.png"

    xcrun simctl launch "$udid" com.apple.Preferences
    sleep 5
    xcrun simctl launch "$udid" net.meshrelay.mesh
    sleep 8
    maestro --device "$udid" test - <<'EOF'
    appId: net.meshrelay.mesh
    ---
    - assertVisible: "New chat"
    EOF
    xcrun simctl io "$udid" screenshot "$artifact_root/screenshots/02-background-foreground.png"

    xcrun simctl terminate "$udid" net.meshrelay.mesh
    sleep 4
    xcrun simctl launch "$udid" net.meshrelay.mesh
    sleep 12
    maestro --device "$udid" test - <<'EOF'
    appId: net.meshrelay.mesh
    ---
    - assertVisible: "New chat"
    EOF
    xcrun simctl io "$udid" screenshot "$artifact_root/screenshots/03-relaunch-reconnect.png"

    curl -fsS -H "X-Mesh-Admin-Key: $(ADMIN_KEY)" \
      "$(RELAY_URL)/admin/live-faults/runtime" > "$(Agent.TempDirectory)/runtime-private.json"
    export ARTIFACT_ROOT="$artifact_root"
    export RUNTIME_PRIVATE="$(Agent.TempDirectory)/runtime-private.json"
    export SOURCE_COMMIT="$(git rev-parse HEAD)"
    export SIMULATOR_RID="$(cat "$(Agent.TempDirectory)/simulator-rid.txt")"
    export HANDLE="$handle"
    export UDID="$udid"
    python3 - <<'PY'
    import hashlib, json, os, glob, subprocess
    raw=json.load(open(os.environ["RUNTIME_PRIVATE"],encoding="utf-8"))
    accepted=[h for h in raw.get("handshakes",[])
              if h.get("stage")=="authenticate" and h.get("accepted") is True]
    if len(accepted) < 2:
        raise SystemExit(f"Expected at least 2 authenticated sessions, got {len(accepted)}")
    nonce_hashes=list(dict.fromkeys(
        hashlib.sha256(h["nonce"].encode()).hexdigest() for h in accepted if h.get("nonce")))
    if len(nonce_hashes) < 2:
        raise SystemExit("Relaunch did not authenticate with a fresh challenge")
    root=os.environ["ARTIFACT_ROOT"]
    shots=[]
    for path in sorted(glob.glob(os.path.join(root,"screenshots","*.png"))):
        data=open(path,"rb").read()
        shots.append({
            "name":os.path.basename(path),
            "sha256":hashlib.sha256(data).hexdigest(),
            "content":"Synthetic identity/topic only; no private user content"
        })
    manifest={
        "status":"IPAD-SIMULATOR-VALIDATED",
        "sourceCommit":os.environ["SOURCE_COMMIT"],
        "releaseBase":"7de3de3c2ddda0b30abb0c42d5b1fd2c2b859710",
        "sdk":"10.0.302",
        "pool":"macos-15",
        "simulator":"iPad Pro 13-inch",
        "simulatorRid":os.environ["SIMULATOR_RID"],
        "syntheticHandleHash":hashlib.sha256(os.environ["HANDLE"].encode()).hexdigest(),
        "authenticatedSessions":len(accepted),
        "freshChallengeCount":len(nonce_hashes),
        "nonceHashes":nonce_hashes,
        "backgroundForeground":True,
        "relaunchReconnect":True,
        "retainedSyntheticTopicRendered":True,
        "screenshots":shots,
        "privacy":"Identifiers and challenges are SHA-256 hashed; no signatures, keys, codes, payloads, or user content retained."
    }
    with open(os.path.join(root,"manifest-redacted.json"),"w",encoding="utf-8") as f:
        json.dump(manifest,f,indent=2); f.write("\n")
    PY
    xcrun simctl spawn "$udid" log show --last 10m --style compact \
      --predicate 'process == "Mesh.App"' > "$artifact_root/ios-app.log" 2>&1 || true
    rm -f "$artifact_root/relay-redacted.log"
    (
      cd "$artifact_root"
      find . -type f -print0 | sort -z | xargs -0 shasum -a 256
    ) > "$artifact_root/SHA256SUMS.txt"
  displayName: Validate linked synthetic identity on 13-inch iPad Simulator

- task: PublishPipelineArtifact@1
  displayName: Publish redacted iPad validation evidence
  condition: succeededOrFailed()
  inputs:
    targetPath: $(Build.ArtifactStagingDirectory)
    artifactName: Sora-iPad-Validation-$(Build.BuildId)
    publishLocation: pipeline
