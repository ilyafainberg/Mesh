# Ephemeral, non-signing simulator screenshot pipeline. This branch is never merged.
trigger: none
pr: none

name: ios-screenshots-$(Date:yyyyMMdd).$(Rev:r)

variables:
  DOTNET_VERSION: '10.0.302'
  XCODE_PATH: '/Applications/Xcode_26.0.1.app/Contents/Developer'
  LOCKED_COMMIT: '7de3de3c2ddda0b30abb0c42d5b1fd2c2b859710'
  APP_VERSION: '1.19.0'
  APP_BUILD: '76'

pool:
  vmImage: macos-15

workspace:
  clean: all

steps:
- checkout: self
  clean: true
  fetchDepth: 0
  persistCredentials: false

- bash: |
    set -euo pipefail
    git cat-file -e "$(LOCKED_COMMIT)^{commit}"
    changed="$(git diff --name-only "$(LOCKED_COMMIT)" HEAD)"
    if [[ "$changed" != "azure-pipelines-ios.yml" ]]; then
      echo "Unexpected changes relative to locked release commit:"
      printf '%s\n' "$changed"
      exit 1
    fi
    test "$(git rev-parse "$(LOCKED_COMMIT)^{commit}")" = "$(LOCKED_COMMIT)"
    echo "Locked release source verified; only this ephemeral pipeline differs."
  displayName: Verify locked release source

- task: UseDotNet@2
  displayName: Use exact .NET 10 SDK
  inputs:
    packageType: sdk
    version: $(DOTNET_VERSION)

- bash: |
    set -euo pipefail
    sudo xcode-select --switch "$(XCODE_PATH)"
    test "$(dotnet --version)" = "$(DOTNET_VERSION)"
    xcodebuild -version
    dotnet --info
    dotnet workload install maui-ios maui-android maui-maccatalyst --skip-manifest-update
    dotnet workload list
  displayName: Select Xcode and install release-aligned workloads

- bash: |
    set -euo pipefail
    arch="$(uname -m)"
    case "$arch" in
      arm64) rid="iossimulator-arm64" ;;
      x86_64) rid="iossimulator-x64" ;;
      *) echo "Unsupported macOS host architecture: $arch"; exit 1 ;;
    esac
    echo "Simulator RID: $rid"
    dotnet build src/Mesh.App/Mesh.App.csproj \
      -f net10.0-ios \
      -c Release \
      -p:RuntimeIdentifier="$rid" \
      -p:ApplicationDisplayVersion="$(APP_VERSION)" \
      -p:ApplicationVersion="$(APP_BUILD)" \
      -p:CodesignKey=- \
      -p:CodesignProvision= \
      -p:ArchiveOnBuild=false

    app_path="$(find src/Mesh.App/bin/Release/net10.0-ios -type d -name '*.app' | head -n 1)"
    test -n "$app_path"
    bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
    version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
    build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
    test "$bundle_id" = "net.meshrelay.mesh"
    test "$version" = "$(APP_VERSION)"
    test "$build" = "$(APP_BUILD)"
    printf '%s' "$app_path" > "$(Agent.TempDirectory)/app-path.txt"
    printf '%s' "$rid" > "$(Agent.TempDirectory)/simulator-rid.txt"
  displayName: Build current release source for iOS Simulator

- bash: |
    set -euo pipefail
    java -version
    curl -fsSL "https://get.maestro.mobile.dev" | bash
    export PATH="$HOME/.maestro/bin:$PATH"
    maestro --version
    printf '%s' "$(maestro --version | tail -n 1)" > "$(Agent.TempDirectory)/maestro-version.txt"
  displayName: Install iOS UI automation

- bash: |
    set -euo pipefail
    export PATH="$HOME/.maestro/bin:$PATH"
    export DEVELOPER_DIR="$(XCODE_PATH)"

    app_path="$(cat "$(Agent.TempDirectory)/app-path.txt")"
    artifact_root="$(Build.ArtifactStagingDirectory)/sora-apple-screenshots"
    screenshot_root="$artifact_root/screenshots"
    flow_root="$(Agent.TempDirectory)/sora-flows"
    mkdir -p "$screenshot_root/iphone-6.5" "$screenshot_root/ipad-13" "$flow_root"

    runtime_id="$(xcrun simctl list runtimes -j | python3 -c '
    import json,sys
    runtimes=json.load(sys.stdin)["runtimes"]
    ios=[r for r in runtimes if r.get("isAvailable") and r.get("identifier","").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
    if not ios: raise SystemExit("No available iOS Simulator runtime")
    def key(r):
        return tuple(int(x) for x in r.get("version","0").split("."))
    print(sorted(ios,key=key)[-1]["identifier"])
    ')"
    runtime_name="$(xcrun simctl list runtimes -j | RUNTIME_ID="$runtime_id" python3 -c '
    import json,os,sys
    for r in json.load(sys.stdin)["runtimes"]:
        if r.get("identifier")==os.environ["RUNTIME_ID"]:
            print(r.get("name",r.get("version","unknown"))); break
    ')"

    available_types="$(xcrun simctl list devicetypes -j)"
    iphone_type="$(python3 -c '
    import json,sys
    matches=[d for d in json.load(sys.stdin)["devicetypes"] if d.get("name")=="iPhone 11 Pro Max"]
    if not matches: raise SystemExit("iPhone 11 Pro Max simulator type is unavailable")
    print(matches[0]["identifier"])
    ' <<< "$available_types")"
    ipad_type="$(python3 -c '
    import json,sys
    matches=[d for d in json.load(sys.stdin)["devicetypes"] if d.get("name","").startswith("iPad Pro 13-inch (M4)")]
    if not matches: raise SystemExit("iPad Pro 13-inch (M4) simulator type is unavailable")
    print(matches[0]["identifier"])
    ' <<< "$available_types")"
    echo "Selected device types: $iphone_type ; $ipad_type"

    iphone_udid="$(xcrun simctl create Sora-iPhone-65 "$iphone_type" "$runtime_id")"
    ipad_udid="$(xcrun simctl create Sora-iPad-13 "$ipad_type" "$runtime_id")"

    cleanup() {
      set +e
      xcrun simctl shutdown "$iphone_udid" >/dev/null 2>&1
      xcrun simctl shutdown "$ipad_udid" >/dev/null 2>&1
      xcrun simctl delete "$iphone_udid" >/dev/null 2>&1
      xcrun simctl delete "$ipad_udid" >/dev/null 2>&1
    }
    trap cleanup EXIT

    capture_set() {
      local udid="$1"
      local folder="$2"
      local expected_width="$3"
      local expected_height="$4"
      local create_y="$5"
      local link_y="$6"
      local restore_y="$7"

      xcrun simctl boot "$udid"
      xcrun simctl bootstatus "$udid" -b
      xcrun simctl status_bar "$udid" override \
        --time "9:41" --batteryState charged --batteryLevel 100 \
        --wifiBars 3 --cellularBars 4

      reset_launch() {
        xcrun simctl terminate "$udid" net.meshrelay.mesh >/dev/null 2>&1 || true
        xcrun simctl uninstall "$udid" net.meshrelay.mesh >/dev/null 2>&1 || true
        xcrun simctl install "$udid" "$app_path"
        xcrun simctl launch "$udid" net.meshrelay.mesh
        sleep 25
      }

      tap_point() {
        local y="$1"
        cat > "$flow_root/tap.yaml" <<EOF
    appId: net.meshrelay.mesh
    ---
    - tapOn:
        point: "50%,$y%"
    EOF
        maestro --device "$udid" test "$flow_root/tap.yaml"
        sleep 3
      }

      reset_launch
      xcrun simctl io "$udid" screenshot "$screenshot_root/$folder/01-welcome.png"

      reset_launch
      tap_point "$link_y"
      xcrun simctl io "$udid" screenshot "$screenshot_root/$folder/02-device-linking.png"

      reset_launch
      tap_point "$restore_y"
      xcrun simctl io "$udid" screenshot "$screenshot_root/$folder/03-backup-restore.png"

      reset_launch
      tap_point "$create_y"
      xcrun simctl io "$udid" screenshot "$screenshot_root/$folder/04-new-identity.png"

      for image in "$screenshot_root/$folder"/*.png; do
        width="$(sips -g pixelWidth "$image" | awk '/pixelWidth/{print $2}')"
        height="$(sips -g pixelHeight "$image" | awk '/pixelHeight/{print $2}')"
        format="$(sips -g format "$image" | awk '/format:/{print $2}')"
        test "$format" = "png"
        test "$width" = "$expected_width"
        test "$height" = "$expected_height"
      done

      xcrun simctl terminate "$udid" net.meshrelay.mesh || true
      xcrun simctl shutdown "$udid"
    }

    capture_set "$iphone_udid" "iphone-6.5" 1242 2688 42 55 68
    capture_set "$ipad_udid" "ipad-13" 2064 2752 44 52 60

    export ARTIFACT_ROOT="$artifact_root"
    export RUNTIME_NAME="$runtime_name"
    export TEMP_COMMIT="$(git rev-parse HEAD)"
    export MAESTRO_VERSION="$(cat "$(Agent.TempDirectory)/maestro-version.txt")"
    export SIMULATOR_RID="$(cat "$(Agent.TempDirectory)/simulator-rid.txt")"
    export XCODE_VERSION="$(xcodebuild -version | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
    export DOTNET_WORKLOADS="$(dotnet workload list | sed -n '/Installed Workload Id/,$p' | tr '\n' ';' | sed 's/"/'\''/g')"
    export BUILD_ID="$(Build.BuildId)"

    python3 - <<'PY'
    import datetime, glob, hashlib, json, os
    root = os.environ["ARTIFACT_ROOT"]
    shots = []
    surfaces = {
        "01-welcome.png": "Onboarding choices",
        "02-device-linking.png": "Device linking form (empty)",
        "03-backup-restore.png": "Encrypted backup restore form (empty)",
        "04-new-identity.png": "New identity form (empty)",
    }
    expected = {
        "iphone-6.5": [1242, 2688],
        "ipad-13": [2064, 2752],
    }
    for path in sorted(glob.glob(os.path.join(root, "screenshots", "*", "*.png"))):
        device_set = os.path.basename(os.path.dirname(path))
        data = open(path, "rb").read()
        shots.append({
            "path": os.path.relpath(path, root).replace(os.sep, "/"),
            "deviceSet": device_set,
            "surface": surfaces[os.path.basename(path)],
            "format": "PNG",
            "pixelDimensions": expected[device_set],
            "orientation": "portrait",
            "sha256": hashlib.sha256(data).hexdigest(),
            "publicSafety": "Fresh simulator state; all fields empty; no user data, credentials, link codes, diagnostics, internal paths, or account identifiers.",
        })
    if len(shots) != 8:
        raise SystemExit(f"Expected 8 screenshots, found {len(shots)}")
    manifest = {
        "status": "SCREENSHOTS-READY",
        "generatedUtc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
        "source": {
            "repository": "ilyafainberg/Mesh",
            "lockedCommit": "7de3de3c2ddda0b30abb0c42d5b1fd2c2b859710",
            "temporaryAutomationCommit": os.environ["TEMP_COMMIT"],
            "treeVerification": "Only azure-pipelines-ios.yml differed from locked commit; application source was unchanged.",
            "version": "1.19.0",
            "build": "76",
        },
        "buildEnvironment": {
            "pipelineRunId": os.environ["BUILD_ID"],
            "poolImage": "macos-15",
            "dotnetSdk": "10.0.302",
            "simulatorRid": os.environ["SIMULATOR_RID"],
            "xcode": os.environ["XCODE_VERSION"],
            "iosRuntime": os.environ["RUNTIME_NAME"],
            "uiAutomation": os.environ["MAESTRO_VERSION"],
            "workloads": os.environ["DOTNET_WORKLOADS"],
        },
        "simulators": [
            {"name": "iPhone 11 Pro Max", "appStoreClass": "6.5-inch iPhone", "pixelDimensions": [1242, 2688]},
            {"name": "iPad Pro 13-inch (M4)", "appStoreClass": "13-inch iPad", "pixelDimensions": [2064, 2752]},
        ],
        "capture": {
            "method": "Native iOS Simulator screen capture via xcrun simctl io screenshot.",
            "transformations": "None. No resizing, stretching, compositing, Android imagery, synthetic chrome, or marketing overlays.",
            "statusBar": "Native Simulator status bar normalized with simctl.",
        },
        "validation": {
            "format": "PNG for all files",
            "orientationConsistency": "Portrait within both sets",
            "dimensions": "Validated exactly against the required device-class dimensions",
            "visualContent": "Fresh-state public onboarding, linking, backup, and identity surfaces with empty fields",
            "upload": "Not uploaded or submitted to App Store Connect",
        },
        "screenshots": shots,
    }
    with open(os.path.join(root, "manifest-redacted.json"), "w", encoding="utf-8") as f:
        json.dump(manifest, f, indent=2)
        f.write("\n")
    report = "\n".join([
        "SCREENSHOTS-READY",
        "Source: ilyafainberg/Mesh @ 7de3de3c2ddda0b30abb0c42d5b1fd2c2b859710",
        "Version/build: 1.19.0 / 76",
        "SDK: .NET 10.0.302",
        f"Xcode: {os.environ['XCODE_VERSION']}",
        f"iOS runtime: {os.environ['RUNTIME_NAME']}",
        "Sets: 4 portrait PNGs at 1242x2688 (6.5-inch iPhone); 4 portrait PNGs at 2064x2752 (13-inch iPad)",
        "Capture: Native simulator pixels, no transformations or overlays",
        "Privacy: Fresh simulator state and empty forms; no private data or account identifiers",
        "App Store Connect: No upload or submission performed",
        "Evidence: manifest-redacted.json contains per-file SHA-256 values",
        "",
    ])
    with open(os.path.join(root, "REPORT-REDACTED.txt"), "w", encoding="utf-8") as f:
        f.write(report)
    PY

    (
      cd "$artifact_root"
      find screenshots -type f -name '*.png' -print0 | sort -z | xargs -0 shasum -a 256
      shasum -a 256 manifest-redacted.json REPORT-REDACTED.txt
    ) > "$artifact_root/SHA256SUMS.txt"
  displayName: Capture and validate genuine App Store screenshots

- task: PublishPipelineArtifact@1
  displayName: Publish screenshots and redacted evidence
  condition: succeededOrFailed()
  inputs:
    targetPath: $(Build.ArtifactStagingDirectory)/sora-apple-screenshots
    artifactName: Sora-Apple-Screenshots-$(Build.BuildId)
    publishLocation: pipeline
