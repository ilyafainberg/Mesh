<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mesh widget host</title>
</head>
<body>
<script>
(function () {
    'use strict';
    var accepted = false;

    addEventListener('message', function (event) {
        var data = event.data;
        if (accepted || event.source !== parent || !data || data.type !== 'mesh-widget-render' ||
            typeof data.nonce !== 'string' || data.nonce.length < 16 ||
            typeof data.html !== 'string') return;
        accepted = true;
        try {
            document.open();
            document.write(data.html);
            document.close();
        } catch (error) {
            parent.postMessage({
                type: 'mesh-widget-host-error',
                nonce: data.nonce,
                errorType: error && error.name ? error.name : 'Error'
            }, '*');
        }
    });

    parent.postMessage({ type: 'mesh-widget-host-ready' }, '*');
})();
</script>
</body>
</html>
